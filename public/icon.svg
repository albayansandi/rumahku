<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  
  <!-- Modern House Silhouette -->
  <path d="M256 120 L380 220 L380 370 C380 376 376 380 370 380 L142 380 C136 380 132 376 132 370 L132 220 Z" fill="#1e293b" stroke="#475569" stroke-width="8"/>
  <path d="M256 110 L400 226 L380 250 L256 150 L132 250 L112 226 Z" fill="url(#accent)"/>
  
  <!-- Blueprint Door / Chart -->
  <rect x="220" y="270" width="72" height="110" rx="8" fill="#0f172a" stroke="url(#accent)" stroke-width="4"/>
  <circle cx="276" cy="326" r="5" fill="#10b981"/>
  
  <!-- Financial Growth Coin / Badge -->
  <circle cx="340" cy="290" r="48" fill="url(#gold)" stroke="#ffffff" stroke-width="4" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.3))"/>
  <text x="340" y="306" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#78350f" text-anchor="middle">Rp</text>
  
  <!-- Blueprint Grid Window -->
  <rect x="160" y="240" width="48" height="48" rx="6" fill="#334155" opacity="0.8"/>
  <line x1="184" y1="240" x2="184" y2="288" stroke="#64748b" stroke-width="3"/>
  <line x1="160" y1="264" x2="208" y2="264" stroke="#64748b" stroke-width="3"/>
</svg>
